configuration:
  certificates:
    name: Zertifikate
    description: Kostenlose Zertifikate von einem ACME-Anbieter wie Let's Encrypt.
    fields:
      email:
        name: ACME-E-Mail-Adresse
        description: Kontaktadresse für das ACME-Konto. Für ZeroSSL und Google Public CA erforderlich. Wird nur einmal beim Registrieren des Kontos verwendet.
      server:
        name: ACME-Server
        description: "Verzeichnis-URL des ACME-Anbieters. Standard ist Let's Encrypt. ZeroSSL: https://acme.zerossl.com/v2/DV90, Google: https://dv.acme-v02.api.pki.goog/directory."
      profile:
        name: ACME-Profil
        description: Beim Anbieter angefragtes Zertifikatsprofil, zum Beispiel shortlived oder tlsserver (Let's Encrypt). Mit none gilt das Standardprofil des Anbieters.
      eab_kid:
        name: EAB-Schlüsselkennung
        description: Schlüsselkennung für External Account Binding. Bei Google Public CA erforderlich, bei ZeroSSL optional, von Let's Encrypt nicht unterstützt.
      eab_hmac_key:
        name: EAB-HMAC-Schlüssel
        description: HMAC-Schlüssel für External Account Binding. Gehört zur Schlüsselkennung.
      key_type:
        name: Schlüsseltyp
        description: Typ des Zertifikatsschlüssels. ecdsa ist Standard und empfohlen.
      key_size:
        name: Schlüsselgröße
        description: Kurve für ecdsa-Schlüssel (Standard secp384r1) oder Länge für rsa-Schlüssel (Standard 4096).
      must_staple:
        name: OCSP Must-Staple
        description: Zertifikate mit Must-Staple anfordern. Wird von ZeroSSL und Google Public CA unterstützt, nicht von Let's Encrypt. Schließt OCSP-Stapling ein.
      ocsp_stapling:
        name: OCSP-Stapling
        description: OCSP-Antworten für Zertifikate des ACME-Anbieters mitsenden. Schaltet die TLS-Zertifikatskompression ab.
      custom_ocsp_stapling:
        name: OCSP-Stapling für eigene Zertifikate
        description: OCSP-Antworten auch für selbst hochgeladene Zertifikate mitsenden, sofern diese es unterstützen.
      verify_acme_tls:
        name: TLS-Zertifikat des ACME-Servers prüfen
        description: Eingeschaltet lassen, außer bei einem privaten ACME-Server mit selbstsigniertem Zertifikat.
      renew_interval_hours:
        name: Prüfintervall für Erneuerungen (Stunden)
        description: Wie oft NPMplus nach zu erneuernden Zertifikaten sucht. Standard 3.
      default_certificate_id:
        name: Standardzertifikat
        description: ID des Zertifikats, das für unbekannte Domains statt eines eingebauten Dummy-Zertifikats ausgeliefert wird.
  network:
    name: Netzwerk
    description: Welche Protokolle NPMplus anbietet und wie es Clients erkennt.
    fields:
      disable_ipv6:
        name: IPv6 abschalten
        description: IPv6 vollständig deaktivieren. Nötig auf Hosts ohne IPv6, sonst startet nginx nicht.
      disable_http:
        name: HTTP abschalten
        description: Nicht auf Port 80 lauschen. Zertifikate per HTTP-01-Challenge brauchen dann eine andere Methode (DNS-Challenge).
      disable_http3:
        name: HTTP/3 abschalten
        description: HTTP/3 und QUIC auf Port 443/udp nicht anbieten.
      trust_cloudflare:
        name: Cloudflare vertrauen
        description: Die Adressbereiche von Cloudflare laden, damit nginx hinter Cloudflare die echte Client-Adresse sieht.
      proxy_protocol:
        name: PROXY-Protokoll auf allen Listenern
        description: Auf jedem Host-Listener das PROXY-Protokoll erwarten. Nötig hinter einem Load Balancer, der es sendet. Überschreibt die beiden folgenden Optionen.
      proxy_protocol_http:
        name: PROXY-Protokoll auf HTTP
        description: Das PROXY-Protokoll nur auf den HTTP-Listenern erwarten.
      proxy_protocol_https:
        name: PROXY-Protokoll auf HTTPS
        description: Das PROXY-Protokoll nur auf den HTTPS-Listenern erwarten. Schaltet HTTP/3 ab.
  nginx:
    name: nginx
    description: Feinabstimmung des Webservers. Die Voreinstellungen passen für fast alle.
    fields:
      worker_processes:
        name: Worker-Prozesse
        description: Anzahl der nginx-Worker oder auto (Standard, empfohlen).
      worker_connections:
        name: Verbindungen pro Worker
        description: Verbindungen je Worker. Standard 512.
      force_x25519mlkem768:
        name: X25519MLKEM768 erzwingen
        description: Nur den Post-Quanten-Schlüsselaustausch X25519MLKEM768 (und TLS 1.3) zulassen. Ältere Clients können sich nicht verbinden.
      disable_tls12:
        name: TLS 1.2 abschalten
        description: Nur TLS 1.3 akzeptieren. Unbedenklich, wenn alle Clients aktuell sind.
      trust_secp_curves:
        name: secp-Kurven zulassen
        description: Die Kurven secp521r1, secp384r1 und secp256r1 zulassen. Standardmäßig an; ausschalten, wenn alle Clients X25519 beherrschen.
      trust_rsa_pkcs1:
        name: RSA-PKCS1-Signaturen zulassen
        description: Nötig für Clients ohne RSA-PSS-Unterstützung, wenn du RSA-Schlüssel nutzt.
      log_not_found:
        name: 404-Fehler protokollieren
        description: 404-Antworten statischer Dateien ins App-Protokoll schreiben.
      load_njs_module:
        name: njs-Modul laden
        description: Ermöglicht JavaScript in nginx-Konfigurationen. Erfordert manuelle Konfiguration.
      load_ldap_module:
        name: LDAP-Modul laden
        description: Erfordert manuelle Konfiguration.
      load_ntlm_module:
        name: NTLM-Modul laden
        description: Erfordert manuelle Konfiguration.
      load_vhost_traffic_status_module:
        name: Modul für Virtual-Host-Traffic-Status laden
        description: Erfordert manuelle Konfiguration.
  logging:
    name: Protokolle und Statistik
    description: Zugriffsprotokolle und die optionale GoAccess-Statistik.
    fields:
      rotate_logs:
        name: Zugriffsprotokolle schreiben und rotieren
        description: Das Zugriffsprotokoll in den Datenordner der App schreiben und täglich rotieren. Standardmäßig aus, um den Speicher zu schonen.
      rotations:
        name: Aufbewahrte Rotationen
        description: Wie viele rotierte Zugriffsprotokolle behalten werden. Standard 3.
      goaccess:
        name: GoAccess-Statistik
        description: Aktiviert GoAccess (und das Schreiben der Protokolle). Erreichbar unter /goaccess der Admin-Oberfläche über den direkten HTTPS-Port, für angemeldete Admins.
      goaccess_arguments:
        name: GoAccess-Argumente
        description: Zusätzliche Kommandozeilenargumente für GoAccess. Ersetzt die Voreinstellung.
  account:
    name: Konten und Sitzungen
    description: Erster Administrator und Sitzungsverhalten.
    fields:
      initial_admin_email:
        name: E-Mail des ersten Administrators
        description: Legt zusammen mit dem Passwort beim ersten Start den ersten Administrator an. Fehlt eines von beiden, fragt der Einrichtungsassistent.
      initial_admin_password:
        name: Passwort des ersten Administrators
        description: Passwort des ersten Administrators. Wird nur beim ersten Start verwendet.
      initial_default_page:
        name: Standardseite
        description: Was Besucher unbekannter Domains sehen. Gilt nur beim ersten Start; danach in der Admin-Oberfläche ändern.
      disable_gravatar:
        name: Gravatar abschalten
        description: Keine Profilbilder von Gravatar laden. Nutzer müssen ihr Profil dafür erneut speichern.
      cookie_secret:
        name: Cookie-Geheimnis
        description: Festes Geheimnis zum Signieren von Cookies. Ohne wird bei jedem Start ein neues erzeugt und angemeldete Sitzungen enden.
  oidc:
    name: OpenID Connect
    description: Anmeldung an der Admin-Oberfläche über einen OpenID-Connect-Anbieter. Nicht über das Ingress-Panel nutzbar, nur über den direkten HTTPS-Port.
    fields:
      redirect_domain:
        name: Weiterleitungsdomain
        description: Domain (bei Bedarf mit Port), auf die der Anbieter zurückleitet, ohne Schema und Pfad.
      issuer_url:
        name: Issuer-URL
        description: Issuer-URL des Anbieters.
      client_id:
        name: Client-ID
        description: Beim Anbieter registrierte Client-ID.
      client_secret:
        name: Client-Secret
        description: Beim Anbieter registriertes Client-Secret.
      require_verified_email:
        name: Verifizierte E-Mail-Adresse verlangen
        description: Nur Nutzer akzeptieren, deren E-Mail-Adresse der Anbieter als verifiziert meldet. Standardmäßig an.
      disable_password_login:
        name: Passwort-Anmeldung abschalten
        description: Nur OpenID Connect erlauben.
  auth_request:
    name: Vorgeschaltete Authentifizierung
    description: Adresse eines Authentifizierungsdienstes neben NPMplus, mit Schema und Port, aber ohne Pfad.
    fields:
      anubis_upstream:
        name: Anubis
        description: Zum Beispiel http://127.0.0.1:8923.
      tinyauth_upstream:
        name: Tinyauth
        description: Zum Beispiel http://127.0.0.1:3000.
      oauth2proxy_upstream:
        name: oauth2-proxy
        description: Zum Beispiel http://127.0.0.1:4180.
      voidauth_upstream:
        name: VoidAuth
        description: Zum Beispiel http://127.0.0.1:3000.
      authelia_upstream:
        name: Authelia
        description: Zum Beispiel http://127.0.0.1:9091.
      authentik_upstream:
        name: authentik
        description: Zum Beispiel https://127.0.0.1:9443. Funktioniert nur mit dem eingebetteten Outpost.
  interface:
    name: Oberfläche
    description: Die Admin-Oberfläche in Home Assistant.
    fields:
      support_footer:
        name: App-Fußzeile anzeigen
        description: Fügt unter der Fußzeile der Admin-Oberfläche eine Zeile mit App-Version und Support-Links hinzu. Standardmäßig an.
  advanced:
    name: Erweitert
    description: Für alles, was die anderen Optionen nicht abdecken.
    fields:
      extra_environment:
        name: Zusätzliche Umgebungsvariablen
        description: "Beliebig viele NPMplus-Umgebungsvariablen, je Eintrag ein NAME=Wert (zum Beispiel NGINX_LOAD_NJS_MODULE=true). Sie werden zuletzt gesetzt und überschreiben die Optionen oben. Welche Variablen es gibt, steht in der compose.yaml von NPMplus."
  migration:
    name: Migration
    description: Übernimmt einmalig die Daten einer bestehenden Nginx-Proxy-Manager-Installation. Siehe Migrationsanleitung in der Dokumentation.
    fields:
      source:
        name: Importieren aus
        description: "community_app liest die Daten der Home-Assistant-Community-App für Nginx Proxy Manager direkt (vorher stoppen), community_app_edge dasselbe für deren Edge-Version. import_folder liest Daten, die du in den Import-Ordner der Konfiguration dieser App kopiert hast. Hat NPMplus bereits eigene Daten, wird nichts importiert."
network:
  80/tcp: HTTP, auch für ACME-HTTP-01-Challenges
  443/tcp: HTTPS (HTTP/1.1 und HTTP/2)
  443/udp: HTTP/3 (QUIC)
  81/tcp: Admin-Oberfläche per HTTPS mit selbstsigniertem Zertifikat (das Ingress-Panel funktioniert auch ohne)
